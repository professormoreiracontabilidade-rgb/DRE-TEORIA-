<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15146a"><title>DRE | Professor Moreira</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#6b28d8,transparent 50%),radial-gradient(circle at bottom right,#007fe5,transparent 50%),#15146a;color:white;font-family:system-ui,Arial}main{max-width:630px;margin:auto;min-height:100dvh;padding:10px;display:flex;flex-direction:column;gap:10px}.top{text-align:center;color:#ffeb39;font-size:clamp(15px,4vw,22px);font-weight:1000}.viewer{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}img{display:block;width:auto;max-width:100%;max-height:calc(100dvh - 160px);aspect-ratio:9/16;object-fit:contain;border-radius:18px;border:3px solid #ffdd31;box-shadow:0 8px 35px #0008}.controls{display:flex;gap:8px;justify-content:space-between}button{border:0;border-radius:16px;padding:15px 10px;font-size:clamp(14px,3.8vw,19px);font-weight:900;color:white;cursor:pointer;flex:1;background:#d72a93;box-shadow:0 4px 0 #851050}button:nth-child(2){background:#1469d5;box-shadow:0 4px 0 #093c89}button:nth-child(3){background:#00a887;box-shadow:0 4px 0 #00674d}.count{text-align:center;font-weight:800;color:#fff}button:focus-visible{outline:3px solid yellow}</style></head><body><main><div class="top">🎓 CURSO DE CONTABILIDADE PROFESSOR MOREIRA</div><div class="viewer"><img id="slide" src="tela_01.webp" alt="Tela 1 da DRE"></div><div class="count" id="count">1 / 40</div><div class="controls"><button onclick="move(-1)">⬅ VOLTAR</button><button onclick="restart()">↻ REINICIAR</button><button onclick="move(1)">AVANÇAR ➡</button></div></main><script>let n=Math.max(0,Math.min(39,Number(localStorage.getItem('moreira-dre-40')||0)));function render(){document.getElementById('slide').src='tela_'+String(n+1).padStart(2,'0')+'.webp';document.getElementById('slide').alt='Tela '+(n+1)+' de 40';document.getElementById('count').textContent=(n+1)+' / 40';localStorage.setItem('moreira-dre-40',n)}function move(v){n=Math.max(0,Math.min(39,n+v));render()}function restart(){n=0;render()}document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});let x=0;document.getElementById('slide').addEventListener('touchstart',e=>x=e.touches[0].clientX,{passive:true});document.getElementById('slide').addEventListener('touchend',e=>{let delta=e.changedTouches[0].clientX-x;if(Math.abs(delta)>55)move(delta<0?1:-1)},{passive:true});render();</script></body></html>
